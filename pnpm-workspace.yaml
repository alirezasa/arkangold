packages:
  - 'api'
  - 'app'
  - 'admin'
  - 'packages/*'
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': true
  msgpackr-extract: true
  prisma: true
  puppeteer: false
  sharp: true
  unrs-resolver: true
# Security fixes for transitive dependencies (pnpm audit)
overrides:
  handlebars@<4.7.10: ^4.7.10
  js-yaml@>=5.0.0 <5.4.1: ^5.4.1
  sharp@<0.35.5: ^0.35.5
  source-map-js@<1.2.2: ^1.2.2
  uuid@<11.1.1: ^11.1.1
  follow-redirects@<1.16.1: ^1.16.1
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  multer@<2.5.0: ^2.5.0
  fast-uri@<3.1.9: ^3.1.9
