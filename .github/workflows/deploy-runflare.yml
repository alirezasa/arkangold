# استقرار خودکار روی رانفلر با هر push به main (محل اصلی استقرار)
#
# فقط سرویس‌هایی که فایل‌هایشان تغییر کرده deploy می‌شوند و هر کدام در یک job جدا و هم‌زمان.
# برای deploy دستی (مثلاً بعد از تغییر متغیرهای محیطی): تب Actions ← Deploy to Runflare ← Run workflow
#
# پیش‌نیاز (Settings ← Secrets and variables ← Actions):
#   Secrets:   RUNFLARE_EMAIL، RUNFLARE_PASSWORD  (حساب رانفلر؛ ورود دومرحله‌ای این حساب باید خاموش باشد)
#   Variables: RUNFLARE_PROJECT   نام (namespace) پروژه در رانفلر
#              RUNFLARE_SERVICE_API، RUNFLARE_SERVICE_APP، RUNFLARE_SERVICE_ADMIN
#              نام سرویس‌ها در رانفلر (پیش‌فرض: arkan-api، arkan-app، arkan-admin)
# جزئیات: docs/deployment/runflare/README.md
name: Deploy to Runflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "سرویس‌ها، جدا شده با کاما (api,app,admin)"
        required: true
        default: "api,app,admin"

permissions:
  contents: read

jobs:
  changes:
    name: تشخیص سرویس‌های تغییرکرده
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            common: &common
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'scripts/deploy/**'
              - '.gitignore'
            api:
              - *common
              - 'api/**'
              - 'packages/**'
              - 'scripts/migrate/**'
            app:
              - *common
              - 'app/**'
              - 'packages/**'
            admin:
              - *common
              - 'admin/**'

      - name: انتخاب سرویس‌ها
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changes }}
          REQUESTED: ${{ github.event.inputs.services }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            list="$REQUESTED"
          else
            list=$(echo "${CHANGED:-[]}" | jq -r 'join(",")')
          fi
          # فقط نام‌های مجاز؛ بقیه (از جمله common) کنار گذاشته می‌شوند
          services=$(echo "$list" | jq -Rc 'split(",") | map(gsub("\\s"; "")) | map(select(. == "api" or . == "app" or . == "admin")) | unique')
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "سرویس‌های انتخاب‌شده: $services"

  deploy:
    name: deploy ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # deployهای یک سرویس پشت سر هم اجرا می‌شوند؛ رانفلر deploy هم‌زمان روی یک سرویس را نمی‌پذیرد.
    concurrency:
      group: deploy-runflare-${{ matrix.service }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: بررسی تنظیمات رانفلر
        env:
          RUNFLARE_EMAIL: ${{ secrets.RUNFLARE_EMAIL }}
          RUNFLARE_PASSWORD: ${{ secrets.RUNFLARE_PASSWORD }}
          RUNFLARE_PROJECT: ${{ vars.RUNFLARE_PROJECT }}
        run: |
          missing=""
          [ -n "$RUNFLARE_EMAIL" ] || missing="$missing secret:RUNFLARE_EMAIL"
          [ -n "$RUNFLARE_PASSWORD" ] || missing="$missing secret:RUNFLARE_PASSWORD"
          [ -n "$RUNFLARE_PROJECT" ] || missing="$missing variable:RUNFLARE_PROJECT"
          if [ -n "$missing" ]; then
            echo "::error::در Settings ← Secrets and variables ← Actions تعریف نشده:$missing"
            exit 1
          fi

      # CLI رسمی رانفلر روی PyPI؛ وابستگی‌های قدیمی آن با پایتون 3.10 سازگارند
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: نصب Runflare CLI
        run: pip install runflare==1.2.0

      - name: استقرار
        env:
          RUNFLARE_EMAIL: ${{ secrets.RUNFLARE_EMAIL }}
          RUNFLARE_PASSWORD: ${{ secrets.RUNFLARE_PASSWORD }}
          RUNFLARE_PROJECT: ${{ vars.RUNFLARE_PROJECT }}
          SERVICE_NAME: ${{ matrix.service == 'api' && (vars.RUNFLARE_SERVICE_API || 'arkan-api') || matrix.service == 'app' && (vars.RUNFLARE_SERVICE_APP || 'arkan-app') || (vars.RUNFLARE_SERVICE_ADMIN || 'arkan-admin') }}
          TERM: dumb
          PYTHONUNBUFFERED: "1"
        run: |
          echo "پروژه: $RUNFLARE_PROJECT ← سرویس: $SERVICE_NAME"
          # CLI فایل‌ها را بر اساس .gitignore ریشه انتخاب می‌کند، فقط فایل‌های تغییرکرده را می‌فرستد و تا پایان
          # build لاگ را نشان می‌دهد. در خطا هم کد خروج صفر برمی‌گرداند؛ نتیجه از روی خروجی تشخیص داده می‌شود.
          # فراخوانی مستقیم تابع deploy به‌جای خط فرمان: رمز عبور از متغیر محیطی خوانده می‌شود و پارسر
          # آرگومان‌های CLI (python-fire) آن را تفسیر نمی‌کند (مثلاً رمز دارای کاما یا فقط عدد)
          set +e
          python - 2>&1 <<'PY' | tee deploy.log
          import os
          from runflare.runflare_client.deploy import deploy

          result = deploy(
              y=False,
              email=os.environ["RUNFLARE_EMAIL"],
              password=os.environ["RUNFLARE_PASSWORD"],
              namespace=os.environ["RUNFLARE_PROJECT"],
              app=os.environ["SERVICE_NAME"],
          )
          if result:
              print(result)
          PY
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || ! grep -q "Files Successfully Uploaded" deploy.log; then
            echo "::error::استقرار $SERVICE_NAME ناموفق بود؛ لاگ بالا و پنل رانفلر ← سرویس ← رویدادها را ببینید"
            exit 1
          fi
